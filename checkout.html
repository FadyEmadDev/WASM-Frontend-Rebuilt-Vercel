<!doctype html><html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | WASM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/motion.css"><script defer src="js/app.js"></script>
</head><body data-page="checkout"><header class="checkout-header"><a href="index.html">WASM</a></header><main class="checkout-main container">
  <form id="checkout-form"><section><h2>Express Checkout</h2><div class="express"><button class="button" type="button">Apple Pay</button><button type="button">Google Pay</button></div><div class="separator"><span>Or pay with card</span></div></section>
    <section><h2>Shipping Information</h2><div class="form-grid"><input class="short" type="email" name="email" placeholder="Email Address" required><input name="firstName" placeholder="First Name" required><input name="lastName" placeholder="Last Name" required><input class="short" name="address" placeholder="Address" required><input class="short" name="apartment" placeholder="Apartment, suite, etc. (optional)"><input name="city" placeholder="City" required><select name="state" required><option value="">State</option><option>CA</option><option>NY</option><option>TX</option></select><input name="zipCode" placeholder="ZIP Code" required></div></section>
    <section><h2>Payment</h2><div class="card-fields"><input class="short" name="card" placeholder="Card Number" inputmode="numeric" required><input name="expiry" placeholder="Expiration Date (MM/YY)" required><input name="securityCode" placeholder="Security Code" required><input class="short" name="cardName" placeholder="Name on Card" required></div></section>
    <button class="button pay-now" type="submit">Pay now</button><p id="checkout-status" role="status"></p>
  </form>
  <aside class="summary"><h2>Order Summary</h2><div class="summary-product"><img src="assets/checkout-product.jpg" alt="WASM FORM Case"><div><b>WASM FORM Case</b><p>Sand Beige • iPhone<br>15 Pro</p></div><strong>$45.00</strong></div><dl><div><dt>Subtotal</dt><dd>$45.00</dd></div><div><dt>Shipping</dt><dd>Calculated at next step</dd></div><div><dt>Taxes</dt><dd>$3.60</dd></div><div class="total"><dt>Total</dt><dd>$48.60</dd></div></dl></aside>
</main><div id="footer" class="footer-light"></div></body></html>
